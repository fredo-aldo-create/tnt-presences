<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T.'N.T. Danse — Présidente</title>

<!-- ═══════════════════════════════════════════════════════════════
     UNE SEULE LIGNE À MODIFIER : collez ci-dessous l'URL de
     l'application Apps Script (celle qui se termine par /exec).
     La partie « ?page=admin » est déjà ajoutée automatiquement.
     ═══════════════════════════════════════════════════════════════ -->
<script>
  var URL_APPLICATION = "https://script.google.com/macros/s/COLLEZ_VOTRE_URL_ICI/exec?page=admin";
</script>

<meta name="description" content="Espace présidente — association T.'N.T. Danse et Comédie">
<meta name="theme-color" content="#FF6FB5">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Présidente">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #FF6FB5;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 80% 12%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.4), transparent),
      radial-gradient(ellipse 90% 50% at 50% 0%, #ff8fc7 0%, transparent 60%);
    background-repeat: no-repeat;
    color: #3a0d24;
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .boite { max-width: 380px; width: 100%; }
  img.logo {
    width: min(200px, 55vw); height: auto; border-radius: 26px;
    box-shadow: 0 0 60px rgba(255,255,255,.4);
  }
  h1 {
    font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
    margin-top: 22px; letter-spacing: .5px;
  }
  p { color: #6b1f42; font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .barre {
    height: 4px; width: 150px; margin: 26px auto 0; border-radius: 4px;
    background: rgba(255,255,255,.5); overflow: hidden; position: relative;
  }
  .barre span {
    position: absolute; inset: 0; border-radius: 4px;
    background: #3a0d24;
    animation: glisse 1.1s ease-in-out infinite;
  }
  @keyframes glisse {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  a.bouton {
    display: inline-block; margin-top: 26px; padding: 14px 26px;
    background: #3a0d24; color: #fff; border-radius: 14px;
    font-weight: 600; font-size: 16px; text-decoration: none;
  }
  .aide {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(58,13,36,.2);
    font-size: 12px; color: #6b1f42; line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) { .barre span { animation: none; } }
</style>
</head>
<body>
  <div class="boite">
    <img class="logo" src="icon-512.png" alt="T.'N.T. Danse">
    <h1>Espace présidente</h1>
    <p id="message">Ouverture de l'application…</p>
    <div class="barre"><span></span></div>
    <a class="bouton" id="lien" href="#">Ouvrir l'application</a>
    <div class="aide">
      Pour retrouver cet espace d'un seul geste :<br>
      sur Android, menu ⋮ puis « Ajouter à l'écran d'accueil ».<br>
      Sur iPhone (Safari uniquement), bouton Partager puis « Sur l'écran d'accueil ».
    </div>
  </div>

<script>
  var lien = document.getElementById('lien');
  var message = document.getElementById('message');
  var barre = document.querySelector('.barre');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  var estInstallee =
    (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (URL_APPLICATION.indexOf('https://script.google.com/macros/s/AKfycbxK6nXqM6-VCabT4tH590BqpwBlvMBif7nwG-YKLwJNzJY_X7FH0NRnOcG7UhB4bQlL/exec?page=admin') >= 0) {
    message.textContent = "L'adresse de l'application n'a pas encore été renseignée dans index.html.";
    barre.style.display = 'none';
    lien.style.display = 'none';
  } else {
    lien.href = URL_APPLICATION;

    if (estInstallee) {
      setTimeout(function () { window.location.replace(URL_APPLICATION); }, 500);
    } else {
      barre.style.display = 'none';
      message.innerHTML =
        "Avant d'ouvrir l'application, ajoutez cette page à votre écran d'accueil " +
        "(voir les instructions ci-dessous) : c'est ce qui donne la bonne icône.<br><br>" +
        "Vous pouvez aussi ouvrir l'application directement, sans l'installer :";
    }
  }
</script>
</body>
</html>
