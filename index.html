<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T.'N.T. Danse — Présences</title>

<!-- ═══════════════════════════════════════════════════════════════
     UNE SEULE LIGNE À MODIFIER : collez ci-dessous l'URL de
     l'application Apps Script (celle qui se termine par /exec).
     ═══════════════════════════════════════════════════════════════ -->
<script>
  var URL_APPLICATION = "https://script.google.com/macros/s/AKfycbxK6nXqM6-VCabT4tH590BqpwBlvMBif7nwG-YKLwJNzJY_X7FH0NRnOcG7UhB4bQlL/exec";
</script>

<meta name="description" content="Feuilles de présence de l'association T.'N.T. Danse et Comédie">
<meta name="theme-color" content="#0d0916">

<!-- Icône sur l'écran d'accueil -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T.'N.T. Présences">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d0916;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(228,79,255,.5), transparent),
      radial-gradient(1px 1px at 80% 12%, rgba(79,216,255,.5), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(ellipse 90% 50% at 50% 0%, #241a3f 0%, transparent 60%);
    background-repeat: no-repeat;
    color: #f0ebfa;
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .boite { max-width: 380px; width: 100%; }
  img.logo {
    width: min(200px, 55vw); height: auto; border-radius: 26px;
    box-shadow: 0 0 60px rgba(228,79,255,.25);
  }
  h1 {
    font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
    margin-top: 22px; letter-spacing: .5px;
  }
  p { color: #9b8fb8; font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .barre {
    height: 4px; width: 150px; margin: 26px auto 0; border-radius: 4px;
    background: #2a2140; overflow: hidden; position: relative;
  }
  .barre span {
    position: absolute; inset: 0; border-radius: 4px;
    background: linear-gradient(90deg, #e44fff, #ffc529);
    animation: glisse 1.1s ease-in-out infinite;
  }
  @keyframes glisse {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  a.bouton {
    display: inline-block; margin-top: 26px; padding: 14px 26px;
    background: #ffc529; color: #241a00; border-radius: 14px;
    font-weight: 600; font-size: 16px; text-decoration: none;
  }
  .aide {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid #2a2140;
    font-size: 12px; color: #6f6390; line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) { .barre span { animation: none; } }
</style>
</head>
<body>
  <div class="boite">
    <img class="logo" src="icon-512.png" alt="T.'N.T. Danse">
    <h1>Feuilles de présence</h1>
    <p id="message">Ouverture de l'application…</p>
    <div class="barre"><span></span></div>
    <a class="bouton" id="lien" href="#">Ouvrir maintenant</a>
    <div class="aide">
      Pour retrouver l'application d'un seul geste :<br>
      sur Android, menu ⋮ puis « Ajouter à l'écran d'accueil ».<br>
      Sur iPhone, bouton Partager puis « Sur l'écran d'accueil ».
    </div>
  </div>

<script>
  var lien = document.getElementById('lien');
  var message = document.getElementById('message');

  if (URL_APPLICATION.indexOf('COLLEZ_VOTRE_URL_ICI') >= 0) {
    message.textContent = "L'adresse de l'application n'a pas encore été renseignée dans index.html.";
    document.querySelector('.barre').style.display = 'none';
    lien.style.display = 'none';
  } else {
    lien.href = URL_APPLICATION;
    // Petite pause : le logo reste visible le temps du chargement,
    // ce qui évite l'impression d'écran blanc.
    setTimeout(function () { window.location.replace(URL_APPLICATION); }, 700);
  }
</script>
</body>
</html>
